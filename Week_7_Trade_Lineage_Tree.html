:root[data-theme="dark"]{--bg:#1c2420;--card:#141a17;--ink:#e8f0ea;--mut:#9fb2a6;--line:#8fbf9f;--acc:#a9d9b5;--hi:#d8e84a;--chip:#2b3a32}

.hide{display:none!important}#tv{display:flex;flex-direction:column;height:100%}
select,button,input{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 10px;max-width:100%;box-sizing:border-box}button{cursor:pointer}
#lp{max-width:1000px;margin:0 auto;padding:18px 14px}h1{font-size:16px;margin:0 0 12px}
.sb{border:2px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
@media(max-width:760px){.sb{grid-template-columns:1fr 1fr}.sb .w{grid-column:1/3}}
.sb label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.sb button{background:var(--acc);color:var(--bg);font-weight:700}
.hint{color:var(--mut);margin:10px 0}.card{border:2px solid var(--line);border-radius:10px;margin:12px 0;background:var(--card)}

.cb{display:grid;grid-template-columns:1fr 1fr}.cb>div{padding:10px 14px}.cb>div+div{border-left:1px solid var(--line)}.cb b{display:block;margin-bottom:6px}.cb p{margin:3px 0}.cb em{font-style:normal;color:var(--mut)}
.cf{display:flex;justify-content:flex-end;padding:8px 14px}
.d{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:baseline}

.lg{color:var(--mut);padding:0 14px 8px;font-size:12px}.lg b{color:var(--hi)}
#vp{flex:1;margin:0 14px 14px;border:2px solid var(--line);border-radius:10px;overflow:hidden;position:relative;touch-action:none;cursor:grab}
#st{position:absolute;left:0;top:0;transform-origin:0 0;padding:30px;width:max-content}
.node{display:flex;flex-direction:column;align-items:center}
.kids{display:flex;margin-top:20px;position:relative;align-items:flex-start}
.kids::before{content:"";position:absolute;top:-20px;left:50%;height:20px;border-left:2px solid var(--line)}
.c{position:relative;padding:20px 8px 0}.c::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:2px solid var(--line)}
.c::after{content:"";position:absolute;top:0;left:0;right:0;border-top:2px solid var(--line)}
.c:first-child::after{left:50%}.c:last-child::after{right:50%}.c:only-child::after{display:none}
.kids.col{flex-direction:column;align-items:center}.col>.c{padding-top:12px}.col>.c::before{height:12px}.col>.c::after{display:none}
.box{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px 10px;min-width:170px;max-width:240px}
.trade{background:var(--chip);text-align:center;font-weight:700}.trade small{display:block;font-weight:400;color:var(--mut)}
.side .t{font-weight:700}.side .g{color:var(--mut)}.side .g div{color:var(--ink)}.side .g div.f{color:var(--hi);font-weight:700}
.leaf.on{border-color:var(--hi)}.leaf .n{font-weight:700}.leaf .m{color:var(--mut);font-size:12px}
.leaf button{margin-top:5px;font-size:12px;padding:3px 7px}
